substitutions:
  _REGION: asia-northeast1
  _PROJECT_ID: baseballsite
  _IMAGE_NAME: yt-shorts-gen
  _TAG: latest-job
  _VOICEVOX_ENGINE_IMAGE: voicevox/voicevox_engine:cpu-latest

steps:
  - id: build yt-shorts-gen image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.yt_shorts
      - --build-arg
      - VOICEVOX_ENGINE_IMAGE=${_VOICEVOX_ENGINE_IMAGE}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/yoshilover/${_IMAGE_NAME}:${_TAG}
      - .

  - id: push yt-shorts-gen image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/yoshilover/${_IMAGE_NAME}:${_TAG}

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/yoshilover/${_IMAGE_NAME}:${_TAG}

timeout: 600s

options:
  machineType: E2_MEDIUM
