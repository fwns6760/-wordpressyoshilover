<!doctype html>
<!--
  451/SNS: ヨシラバー X投稿用データカード デザイン案 (Claude HTML/CSS設計)
  ブラウザで開いて見た目確認 → OK なら本番 HTML→PNG (headless Chromium) で量産。
  1080x1080 (X 正方形)。 オレンジ強め / @yoshilover_giants ブランド入り。
  サンプル: 大城卓三 (打率.347 NPB3位)。 本番は data を差し込む。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root{ --o:#ff6a00; --od:#e25400; --ol:#fff3ea; --ink:#161616; --mut:#7a7a7a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#ccc; display:flex; justify-content:center; padding:24px;
        font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif; }
  /* === 1080x1080 カード === */
  .card{ width:1080px; height:1080px; background:#fff; position:relative; overflow:hidden;
         display:flex; flex-direction:column; }
  /* ヘッダー帯 (オレンジ) */
  .hd{ background:linear-gradient(100deg,var(--o),var(--od)); color:#fff;
       padding:38px 52px; display:flex; align-items:center; justify-content:space-between; }
  .hd .brand{ display:flex; align-items:center; gap:18px; }
  .hd .g{ width:74px; height:74px; border-radius:50%; background:#fff; color:var(--o);
          font-size:50px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .hd .t1{ font-size:34px; font-weight:900; letter-spacing:.02em; }
  .hd .t2{ font-size:20px; font-weight:700; opacity:.92; margin-top:2px; }
  .hd .yr{ font-size:30px; font-weight:900; background:rgba(0,0,0,.18); padding:8px 22px; border-radius:12px; }
  /* 本体 */
  .bd{ flex:1; padding:46px 60px 0; display:flex; flex-direction:column; }
  .name{ font-size:78px; font-weight:900; color:var(--ink); line-height:1.05; }
  .meta{ font-size:26px; font-weight:700; color:var(--od); margin-top:10px; }
  .meta .pos{ background:var(--ol); padding:4px 16px; border-radius:8px; margin-right:10px; }
  /* hero stat */
  .hero{ display:flex; align-items:flex-end; gap:46px; margin:48px 0 0; }
  .hero .big{ }
  .hero .big .v{ font-size:150px; font-weight:900; color:var(--o); line-height:.9;
                 font-variant-numeric:tabular-nums; }
  .hero .big .l{ font-size:30px; font-weight:800; color:var(--mut); margin-top:6px; }
  .rankpill{ background:var(--o); color:#fff; font-size:34px; font-weight:900;
             padding:14px 30px; border-radius:999px; margin-bottom:28px;
             box-shadow:0 6px 18px rgba(226,84,0,.35); }
  .rankpill .npb{ font-size:22px; opacity:.9; margin-right:8px; }
  /* sub stats */
  .subs{ display:flex; gap:20px; margin:50px 0 0; }
  .subs .s{ flex:1; background:var(--ol); border-radius:18px; padding:26px 0; text-align:center; }
  .subs .s .v{ font-size:60px; font-weight:900; color:var(--od); line-height:1; font-variant-numeric:tabular-nums; }
  .subs .s .l{ font-size:24px; font-weight:700; color:var(--mut); margin-top:10px; }
  /* 一言 */
  .pt{ margin:46px 0 0; font-size:30px; font-weight:800; color:var(--ink);
       border-left:8px solid var(--o); padding-left:20px; line-height:1.4; }
  /* フッター */
  .ft{ margin-top:auto; background:var(--ink); color:#fff; padding:26px 60px;
       display:flex; align-items:center; justify-content:space-between; font-size:22px; }
  .ft .l{ font-weight:700; }
  .ft .r{ color:#ffb27a; font-weight:800; }
</style>
</head>
<body>
  <div class="card">
    <div class="hd">
      <div class="brand">
        <div class="g">G</div>
        <div>
          <div class="t1">ヨシラバー 巨人データ</div>
          <div class="t2">@yoshilover_giants</div>
        </div>
      </div>
      <div class="yr">2026</div>
    </div>

    <div class="bd">
      <div class="name">大城卓三</div>
      <div class="meta"><span class="pos">捕手</span>背番号 24</div>

      <div class="hero">
        <div class="big">
          <div class="v">.347</div>
          <div class="l">打率</div>
        </div>
        <div class="rankpill"><span class="npb">NPB</span>3位 <span style="font-size:22px;opacity:.85">/160人中</span></div>
      </div>

      <div class="subs">
        <div class="s"><div class="v">33</div><div class="l">安打</div></div>
        <div class="s"><div class="v">14</div><div class="l">打点</div></div>
        <div class="s"><div class="v">40</div><div class="l">試合</div></div>
        <div class="s"><div class="v">.500</div><div class="l">終盤打率</div></div>
      </div>

      <div class="pt">終盤に強い。勝負どころで打てる捕手。</div>
    </div>

    <div class="ft">
      <div class="l">2026シーズン ・ NPB公式box集計</div>
      <div class="r">yoshilover.com/data</div>
    </div>
  </div>
</body>
</html>
