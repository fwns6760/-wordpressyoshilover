<!doctype html>
<!-- 451/SNS: 「終盤に強い男」カード案 (split可視化型)。岸田行倫 実データ。1080x1080。 -->
<html lang="ja"><head><meta charset="utf-8"><style>
  :root{ --o:#ff6a00; --od:#e25400; --ol:#fff3ea; --gray:#dcd3cc; --ink:#161616; --mut:#7a7a7a; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#ccc;display:flex;justify-content:center;padding:24px;
       font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;display:flex;flex-direction:column;overflow:hidden;}
  .hd{background:linear-gradient(100deg,var(--o),var(--od));color:#fff;padding:36px 52px;
      display:flex;align-items:center;justify-content:space-between;}
  .hd .brand{display:flex;align-items:center;gap:16px;}
  .hd .g{width:68px;height:68px;border-radius:50%;background:#fff;color:var(--o);font-size:46px;
         font-weight:900;display:flex;align-items:center;justify-content:center;}
  .hd .t1{font-size:30px;font-weight:900;} .hd .t2{font-size:18px;font-weight:700;opacity:.92;}
  .hd .yr{font-size:26px;font-weight:900;background:rgba(0,0,0,.18);padding:7px 18px;border-radius:10px;}
  .bd{flex:1;padding:50px 64px 0;display:flex;flex-direction:column;}
  .hook{font-size:64px;font-weight:900;color:var(--o);line-height:1;}
  .hook .em{background:var(--o);color:#fff;padding:4px 18px;border-radius:14px;}
  .name{font-size:54px;font-weight:900;color:var(--ink);margin:24px 0 0;}
  .name .pos{font-size:26px;color:var(--od);background:var(--ol);padding:4px 14px;border-radius:8px;margin-left:14px;vertical-align:middle;}
  /* バー */
  .bars{margin:44px 0 0;}
  .bar{display:flex;align-items:center;gap:24px;margin:0 0 26px;}
  .bar .nm{width:130px;font-size:34px;font-weight:800;color:var(--ink);flex:none;}
  .bar .tr{flex:1;background:#f1e7df;border-radius:14px;height:64px;overflow:hidden;}
  .bar .fl{height:100%;border-radius:14px;background:var(--gray);}
  .bar.top .fl{background:linear-gradient(90deg,var(--o),var(--od));}
  .bar .vl{width:170px;font-size:46px;font-weight:900;color:var(--mut);text-align:right;flex:none;font-variant-numeric:tabular-nums;}
  .bar.top .vl{color:var(--o);}
  .pt{margin:34px 0 0;font-size:36px;font-weight:800;color:var(--ink);
      border-left:8px solid var(--o);padding-left:22px;}
  .ft{margin-top:auto;background:var(--ink);color:#fff;padding:24px 64px;
      display:flex;align-items:center;justify-content:space-between;font-size:21px;}
  .ft .r{color:#ffb27a;font-weight:800;}
</style></head><body>
  <div class="card">
    <div class="hd">
      <div class="brand"><div class="g">G</div><div>
        <div class="t1">ヨシラバー 巨人データ</div><div class="t2">@yoshilover_giants</div></div></div>
      <div class="yr">2026</div>
    </div>
    <div class="bd">
      <div class="hook"><span class="em">終盤</span>に強い男</div>
      <div class="name">岸田行倫<span class="pos">捕手</span></div>
      <div class="bars">
        <div class="bar"><div class="nm">序盤</div>
          <div class="tr"><div class="fl" style="width:46%"></div></div><div class="vl">.207</div></div>
        <div class="bar"><div class="nm">中盤</div>
          <div class="tr"><div class="fl" style="width:59%"></div></div><div class="vl">.267</div></div>
        <div class="bar top"><div class="nm">終盤</div>
          <div class="tr"><div class="fl" style="width:94%"></div></div><div class="vl">.423</div></div>
      </div>
      <div class="pt">7回以降、勝負どころで打つ。(終盤 11安打/26打数)</div>
    </div>
    <div class="ft">
      <div>2026シーズン ・ 終盤=7〜9回 ・ NPB公式box集計</div>
      <div class="r">yoshilover.com/data</div>
    </div>
  </div>
</body></html>
