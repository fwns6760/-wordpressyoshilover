site_name: Yoshilover Docs
site_description: Public-safe documentation entry point for the yoshilover automation repo.
docs_dir: mkdocs_docs
site_dir: build/mkdocs-site

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: ダークモードへ切替
    - scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ切替
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

nav:
  - Home: index.md
  - 仕様 (Spec):
      - 記事生成パイプライン: spec/article-pipeline.md
      - 通知メール (publish-notice): spec/publish-notice.md
      - X 投稿候補メール (x-post-mail): spec/x-post-mail.md
      - データ記事 (data-insight): spec/data-insight.md
      - アイキャッチ (featured_media): spec/eyecatch.md
      - メール lane の住み分け: spec/mail-lanes.md
      - X インプ向上プラン: spec/x-impression-plan.md
      - 巨人選手データサイト (per-player daily): spec/data-site.md
      - "★ 巨人 個人データサイト No.1 設計図 (右サイドバー全取り込み)": spec/data-site-no1-design.md
      - "★ データサイト ライバル超え 構築バックログ (468)": spec/data-site-rival-parity.md
      - データサイト 再設計 (サイトマップ/ワイヤー/UIUX, 455): spec/data-site-redesign.md
      - データサイト 目標設計図 (ベンチ対比, 452): spec/data-site-target-design.md
      - データサイト 状況別スプリット拡張 (452): spec/data-site-situational-splits.md
      - 巨人 SNS リアルタイム話題 (sns-realtime-topic): spec/sns-realtime-topic.md
  - 運用 (Operations):
      - 運用ルール: operations/policy.md
      - Deploy 手順: operations/deploy.md
      - Env / フィーチャーフラグ: operations/env-flags.md
      - Cloud Scheduler 一覧: operations/scheduler.md
      - Local Preview: operations/local-preview.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
