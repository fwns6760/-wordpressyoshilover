<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/><stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>
  <rect x="0" y="14" width="1080" height="290" fill="url(#header)"/>
  <rect x="0" y="304" width="1080" height="8" fill="#000000"/>
  <text x="540" y="100" text-anchor="middle" font-size="40" font-weight="900" fill="#FFD700">🔥 {{ hook_line }}</text>
  <text x="540" y="200" text-anchor="middle" font-size="120" font-weight="900" fill="#ffffff">{{ player_name }} <tspan fill="#FFD700">★</tspan></text>
  <text x="540" y="245" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">{{ player_team }} / {{ player_position }}</text>
  <text x="540" y="290" text-anchor="middle" font-size="48" font-weight="900" fill="#FFD700">{{ crown_count }} 冠 王</text>
  {% for tile in tiles %}
  {% set col = loop.index0 % 3 %}
  {% set row_i = loop.index0 // 3 %}
  {% set x = 60 + col * 320 %}
  {% set y = 350 + row_i * 250 %}
  <g filter="url(#dropShadow)"><rect x="{{ x }}" y="{{ y }}" width="320" height="220" fill="url(#tile)"/></g>
  <text x="{{ x + 160 }}" y="{{ y + 50 }}" text-anchor="middle" font-size="32" font-weight="900" fill="#FFD700">{{ tile.label }}</text>
  <text x="{{ x + 160 }}" y="{{ y + 160 }}" text-anchor="middle" font-size="{{ tile.font_size | default(120) }}" font-weight="900" fill="#ffffff" style="font-feature-settings:'tnum'">{{ tile.value }}</text>
  <text x="{{ x + 160 }}" y="{{ y + 200 }}" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">12 球団 {{ tile.rank }} 位</text>
  {% endfor %}
  <rect x="0" y="860" width="1080" height="120" fill="#000000"/>
  <rect x="0" y="860" width="1080" height="6" fill="#FF6F00"/>
  <text x="540" y="920" text-anchor="middle" font-size="40" font-weight="900" fill="#FFD700">⚡ {{ footer_summary }}</text>
  <text x="540" y="960" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">{{ subtitle }}</text>
  <text x="540" y="1025" text-anchor="middle" font-size="26" font-weight="900" fill="#FF6F00">{{ footer_handle }}</text>
  <text x="540" y="1055" text-anchor="middle" font-size="20" font-weight="bold" fill="#888">{{ footer_meta }}</text>
</svg>
