<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/><stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>
  <rect x="0" y="14" width="1080" height="290" fill="url(#header)"/>
  <rect x="0" y="304" width="1080" height="8" fill="#000000"/>
  <text x="540" y="100" text-anchor="middle" font-size="40" font-weight="900" fill="#FFD700">🔥 {{ hook_line }}</text>
  <text x="540" y="200" text-anchor="middle" font-size="120" font-weight="900" fill="#ffffff">{{ player_name }} <tspan fill="#FFD700">★</tspan></text>
  <text x="540" y="245" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">{{ player_team }} / {{ player_position }}</text>
  <text x="540" y="290" text-anchor="middle" font-size="48" font-weight="900" fill="#FFD700">{{ crown_count }} 冠 王</text>
  {% for tile in primary_tiles %}
  {% set x = 60 + loop.index0 * 320 %}
  <g filter="url(#dropShadow)"><rect x="{{ x }}" y="350" width="320" height="320" fill="url(#tile)"/></g>
  <text x="{{ x + 160 }}" y="410" text-anchor="middle" font-size="40" font-weight="900" fill="#FFD700">{{ tile.label }}</text>
  <text x="{{ x + 160 }}" y="570" text-anchor="middle" font-size="{{ tile.font_size | default(150) }}" font-weight="900" fill="#ffffff" style="font-feature-settings:'tnum'">{{ tile.value }}</text>
  <text x="{{ x + 160 }}" y="635" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">12 球団 1 位</text>
  {% endfor %}
  <text x="60" y="730" font-size="28" font-weight="900" fill="#000">▼ その他 主要指標</text>
  <line x1="60" y1="745" x2="1020" y2="745" stroke="#FF6F00" stroke-width="3"/>
  {% for row in secondary_rows %}
  {% set y = 800 + loop.index0 * 70 %}
  {% if not loop.first %}<line x1="60" y1="{{ y - 50 }}" x2="1020" y2="{{ y - 50 }}" stroke="#eee" stroke-width="1"/>{% endif %}
  <text x="80" y="{{ y }}" font-size="32" font-weight="bold" fill="#555">{{ row.label }}</text>
  <text x="300" y="{{ y }}" font-size="44" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ row.value }}</text>
  <text x="1020" y="{{ y }}" text-anchor="end" font-size="28" font-weight="900" fill="#FF6F00">12 球団 {{ row.rank }} 位</text>
  {% endfor %}
  <line x1="60" y1="970" x2="1020" y2="970" stroke="#000" stroke-width="2"/>
  <text x="540" y="1020" text-anchor="middle" font-size="26" font-weight="900" fill="#FF6F00">{{ footer_handle }}</text>
  <text x="540" y="1050" text-anchor="middle" font-size="20" font-weight="bold" fill="#888">{{ footer_meta }}</text>
</svg>
