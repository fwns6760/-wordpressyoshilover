<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>
  <text x="60" y="80" font-size="44" font-weight="900" fill="#000">{{ title }}</text>
  <text x="60" y="115" font-size="22" font-weight="bold" fill="#666">{{ subtitle }}</text>
  <line x1="60" y1="135" x2="1020" y2="135" stroke="#000" stroke-width="4"/>
  <rect x="60" y="135" width="1020" height="4" fill="#FF6F00"/>
  <rect x="60" y="160" width="960" height="790" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="60" y="160" width="960" height="56" fill="#FF6F00"/>
  <text x="180" y="198" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">選手</text>
  {% for col in columns %}
  <text x="{{ 380 + loop.index0 * 120 }}" y="198" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">{{ col }}</text>
  {% endfor %}
  {% for player in players %}
  {% set y_base = 240 + loop.index0 * 90 %}
  {% if not loop.first %}<line x1="60" y1="{{ y_base - 35 }}" x2="1020" y2="{{ y_base - 35 }}" stroke="#000" stroke-width="1"/>{% endif %}
  <text x="180" y="{{ y_base }}" text-anchor="middle" font-size="32" font-weight="900" fill="#000">{{ player.name }}</text>
  <text x="180" y="{{ y_base + 30 }}" text-anchor="middle" font-size="18" font-weight="bold" fill="#888">{{ player.position }}</text>
  {% for v in player.stats %}
  <text x="{{ 380 + loop.index0 * 120 }}" y="{{ y_base + 10 }}" text-anchor="middle" font-size="42" font-weight="900" fill="{{ '#FF6F00' if player.is_leader else '#000' }}" stroke="{{ '#000' if player.is_leader else 'none' }}" stroke-width="{{ '0.5' if player.is_leader else '0' }}" style="font-feature-settings:'tnum'">{{ v }}</text>
  {% endfor %}
  {% endfor %}
  <rect x="0" y="980" width="1080" height="100" fill="#000000"/>
  <rect x="0" y="980" width="1080" height="4" fill="#FF6F00"/>
  <text x="60" y="1030" font-size="26" font-weight="900" fill="#FFD700">{{ footer_summary }}</text>
  <text x="1020" y="1030" text-anchor="end" font-size="22" font-weight="bold" fill="#ffffff">{{ footer_handle }}</text>
  <text x="60" y="1060" font-size="20" fill="#cccccc">{{ footer_meta }}</text>
</svg>
