<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="heroStat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>
  <rect x="0" y="14" width="1080" height="200" fill="url(#header)"/>
  <rect x="0" y="214" width="1080" height="6" fill="#000000"/>
  <text x="540" y="80" text-anchor="middle" font-size="36" font-weight="900" fill="#FFD700">🔥 {{ hook_line }}</text>
  <text x="540" y="135" text-anchor="middle" font-size="50" font-weight="900" fill="#ffffff">{{ player_name }} {{ pitch_outcome }}</text>
  <text x="540" y="175" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">{{ game_meta }}</text>
  <text x="540" y="205" text-anchor="middle" font-size="28" font-weight="900" fill="#FFD700">{{ result_line }}</text>
  <text x="540" y="305" text-anchor="middle" font-size="74" font-weight="900" fill="#000">{{ player_name }} <tspan fill="#FFD700">★</tspan></text>
  <text x="540" y="350" text-anchor="middle" font-size="28" font-weight="bold" fill="#FF6F00">{{ player_team }} / 投手 ({{ player_throws_bats }})</text>
  <line x1="200" y1="380" x2="880" y2="380" stroke="#000" stroke-width="3"/>
  <line x1="200" y1="388" x2="880" y2="388" stroke="#FF6F00" stroke-width="2"/>
  {% for stat in stats %}
  {% set col = loop.index0 % 3 %}
  {% set row_i = loop.index0 // 3 %}
  {% set x = 60 + col * 320 %}
  {% set y = 410 + row_i * 200 %}
  {% if stat.highlight %}
  <rect x="{{ x }}" y="{{ y }}" width="320" height="180" fill="url(#heroStat)" stroke="#000" stroke-width="4"/>
  <text x="{{ x + 160 }}" y="{{ y + 45 }}" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">{{ stat.label }}</text>
  <text x="{{ x + 160 }}" y="{{ y + 145 }}" text-anchor="middle" font-size="100" font-weight="900" fill="#FFD700" stroke="#000" stroke-width="2" style="font-feature-settings:'tnum'">{{ stat.value }}</text>
  {% else %}
  <rect x="{{ x }}" y="{{ y }}" width="320" height="180" fill="#ffffff" stroke="#000" stroke-width="4"/>
  <text x="{{ x + 160 }}" y="{{ y + 45 }}" text-anchor="middle" font-size="28" font-weight="900" fill="#FF6F00">{{ stat.label }}</text>
  <text x="{{ x + 160 }}" y="{{ y + 145 }}" text-anchor="middle" font-size="100" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ stat.value }}</text>
  {% endif %}
  {% endfor %}
  <rect x="60" y="820" width="960" height="160" fill="url(#header)" stroke="#000" stroke-width="4"/>
  <line x1="380" y1="820" x2="380" y2="980" stroke="#ffffff" stroke-width="3"/>
  <line x1="700" y1="820" x2="700" y2="980" stroke="#ffffff" stroke-width="3"/>
  {% for s in season_stats %}
  {% set x = 220 + loop.index0 * 320 %}
  <text x="{{ x }}" y="865" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">{{ s.label }}</text>
  <text x="{{ x }}" y="945" text-anchor="middle" font-size="50" font-weight="900" fill="#FFD700" style="font-feature-settings:'tnum'">{{ s.value }}</text>
  {% endfor %}
  <text x="540" y="1045" text-anchor="middle" font-size="22" fill="#888">{{ footer_handle }} — {{ footer_meta }}</text>
</svg>
