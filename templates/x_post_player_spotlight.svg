<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="bigNum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="2" dy="3"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>
  <rect x="0" y="14" width="1080" height="180" fill="url(#header)"/>
  <rect x="0" y="194" width="1080" height="6" fill="#000000"/>
  <text x="60" y="68" font-size="30" font-weight="900" fill="#FFD700">{{ hook_line }}</text>
  <text x="60" y="140" font-size="46" font-weight="900" fill="#ffffff">SPOTLIGHT</text>
  <text x="1020" y="140" text-anchor="end" font-size="30" font-weight="bold" fill="#ffffff">{{ date_str }}</text>
  <text x="540" y="295" text-anchor="middle" font-size="92" font-weight="900" fill="#000">{{ player_name }} <tspan fill="#FFD700">★</tspan></text>
  <text x="540" y="340" text-anchor="middle" font-size="32" font-weight="900" fill="#FF6F00">{{ player_team }} / {{ player_position }}</text>
  <line x1="200" y1="372" x2="880" y2="372" stroke="#000" stroke-width="3"/>
  <line x1="200" y1="380" x2="880" y2="380" stroke="#FF6F00" stroke-width="2"/>
  <text x="540" y="450" text-anchor="middle" font-size="44" font-weight="900" fill="#000">{{ metric_label }}</text>
  <text x="540" y="680" text-anchor="middle" font-size="280" font-weight="900" fill="url(#bigNum)" stroke="#000" stroke-width="4" style="font-feature-settings:'tnum'">{{ hero_value }}</text>
  <rect x="60" y="740" width="960" height="190" fill="none" stroke="#000" stroke-width="4"/>
  <line x1="540" y1="740" x2="540" y2="930" stroke="#000" stroke-width="3"/>
  <text x="300" y="790" text-anchor="middle" font-size="30" font-weight="900" fill="#FF6F00">{{ sub1_label }}</text>
  <text x="300" y="880" text-anchor="middle" font-size="82" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ sub1_value }}</text>
  <text x="780" y="790" text-anchor="middle" font-size="30" font-weight="900" fill="#FF6F00">{{ sub2_label }}</text>
  <text x="780" y="880" text-anchor="middle" font-size="82" font-weight="900" fill="#FF6F00" style="font-feature-settings:'tnum'">{{ sub2_value }}</text>
  <rect x="0" y="950" width="1080" height="130" fill="#000000"/>
  <rect x="0" y="950" width="1080" height="6" fill="#FF6F00"/>
  <text x="60" y="1005" font-size="28" font-weight="900" fill="#FFD700">{{ comment_line }}</text>
  <text x="1020" y="1060" text-anchor="end" font-size="22" font-weight="bold" fill="#ffffff">{{ footer_handle }} — {{ footer_meta }}</text>
</svg>
