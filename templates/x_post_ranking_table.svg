<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="giantsOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="giantsRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>

  <rect x="0" y="14" width="1080" height="240" fill="url(#giantsOrange)"/>
  <rect x="0" y="254" width="1080" height="8" fill="#000000"/>

  <text x="540" y="115" text-anchor="middle" font-size="42" font-weight="900" fill="#FFD700">{{ hook_line }}</text>
  <text x="540" y="195" text-anchor="middle" font-size="74" font-weight="900" fill="#ffffff">{{ title }}</text>
  <text x="540" y="235" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">{{ subtitle }}</text>

  {% for row in rows %}
  {% set y_base = 345 + loop.index0 * 85 %}
  {% if row.is_giants %}
  <g filter="url(#dropShadow)">
    <rect x="40" y="{{ y_base - 60 }}" width="1000" height="80" fill="url(#giantsRow)"/>
  </g>
  <text x="100" y="{{ y_base + 5 }}" text-anchor="middle" font-size="60" font-weight="900" fill="#FFD700" style="font-feature-settings:'tnum'">{{ row.rank }}</text>
  <text x="180" y="{{ y_base - 10 }}" font-size="50" font-weight="900" fill="#ffffff">{{ row.name }} <tspan fill="#FFD700">★</tspan></text>
  <text x="180" y="{{ y_base + 20 }}" font-size="22" font-weight="900" fill="#FFD700">{{ row.team }}</text>
  <text x="1020" y="{{ y_base + 10 }}" text-anchor="end" font-size="76" font-weight="900" fill="#ffffff" style="font-feature-settings:'tnum'">{{ row.value }}</text>
  {% else %}
  <line x1="60" y1="{{ y_base - 65 }}" x2="1020" y2="{{ y_base - 65 }}" stroke="#e0e0e0" stroke-width="2"/>
  <text x="100" y="{{ y_base }}" text-anchor="middle" font-size="56" font-weight="900" fill="#bbb" style="font-feature-settings:'tnum'">{{ row.rank }}</text>
  <text x="180" y="{{ y_base }}" font-size="40" font-weight="900" fill="#000">{{ row.name }}</text>
  <text x="180" y="{{ y_base + 30 }}" font-size="22" font-weight="bold" fill="#888">{{ row.team }}</text>
  <text x="1020" y="{{ y_base + 5 }}" text-anchor="end" font-size="68" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ row.value }}</text>
  {% endif %}
  {% endfor %}

  <text x="540" y="1035" text-anchor="middle" font-size="26" font-weight="900" fill="#FF6F00">{{ footer_handle }}</text>
  <text x="540" y="1065" text-anchor="middle" font-size="20" font-weight="bold" fill="#888">{{ footer_meta }}</text>
</svg>
