<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="giantsRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00"/><stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
    <linearGradient id="result" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/><stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>
  <rect x="0" y="14" width="1080" height="160" fill="url(#header)"/>
  <rect x="0" y="174" width="1080" height="6" fill="#000000"/>
  <text x="60" y="62" font-size="28" font-weight="900" fill="#FFD700">{{ hook_line }}</text>
  <text x="540" y="120" text-anchor="middle" font-size="54" font-weight="900" fill="#ffffff">⚾ 試合速報</text>
  <text x="540" y="165" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">{{ game_meta }}</text>
  <text x="270" y="250" text-anchor="middle" font-size="54" font-weight="900" fill="#FF6F00">巨人</text>
  <text x="810" y="250" text-anchor="middle" font-size="54" font-weight="900" fill="#000">{{ opponent_name }}</text>
  <text x="540" y="248" text-anchor="middle" font-size="46" font-weight="900" fill="#888">VS</text>
  <rect x="60" y="290" width="960" height="320" fill="none" stroke="#000" stroke-width="5"/>
  <rect x="60" y="290" width="960" height="60" fill="#000000"/>
  <text x="140" y="332" text-anchor="middle" font-size="28" font-weight="900" fill="#FF6F00">チーム</text>
  {% for inning in range(1, 10) %}
  <text x="{{ 280 + (inning - 1) * 70 }}" y="332" text-anchor="middle" font-size="30" font-weight="900" fill="#ffffff">{{ inning }}</text>
  {% endfor %}
  <text x="930" y="334" text-anchor="middle" font-size="36" font-weight="900" fill="#FFD700">R</text>
  <text x="980" y="334" text-anchor="middle" font-size="36" font-weight="900" fill="#ffffff">H</text>
  <rect x="61" y="351" width="958" height="125" fill="url(#giantsRow)"/>
  <line x1="60" y1="476" x2="1020" y2="476" stroke="#000" stroke-width="3"/>
  <text x="140" y="438" text-anchor="middle" font-size="40" font-weight="900" fill="#ffffff">巨人 <tspan fill="#FFD700">★</tspan></text>
  {% for v in giants_innings %}
  <text x="{{ 280 + loop.index0 * 70 }}" y="438" text-anchor="middle" font-size="48" font-weight="900" fill="#ffffff" style="font-feature-settings:'tnum'">{{ v }}</text>
  {% endfor %}
  <text x="930" y="442" text-anchor="middle" font-size="68" font-weight="900" fill="#FFD700" stroke="#000" stroke-width="2" style="font-feature-settings:'tnum'">{{ giants_r }}</text>
  <text x="980" y="442" text-anchor="middle" font-size="58" font-weight="900" fill="#ffffff" style="font-feature-settings:'tnum'">{{ giants_h }}</text>
  <text x="140" y="560" text-anchor="middle" font-size="40" font-weight="900" fill="#000">{{ opponent_short }}</text>
  {% for v in opponent_innings %}
  <text x="{{ 280 + loop.index0 * 70 }}" y="560" text-anchor="middle" font-size="48" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ v }}</text>
  {% endfor %}
  <text x="930" y="563" text-anchor="middle" font-size="68" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ opponent_r }}</text>
  <text x="980" y="563" text-anchor="middle" font-size="58" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ opponent_h }}</text>
  <rect x="60" y="660" width="960" height="120" fill="url(#result)" stroke="#000" stroke-width="4"/>
  <text x="540" y="730" text-anchor="middle" font-size="64" font-weight="900" fill="#ffffff" stroke="#000" stroke-width="2">{{ result_line }}</text>
  <text x="540" y="770" text-anchor="middle" font-size="32" font-weight="900" fill="#FFD700">{{ result_sub }}</text>
  <rect x="60" y="810" width="960" height="180" fill="none" stroke="#000" stroke-width="4"/>
  <line x1="380" y1="810" x2="380" y2="990" stroke="#000" stroke-width="2"/>
  <line x1="700" y1="810" x2="700" y2="990" stroke="#000" stroke-width="2"/>
  {% for h in highlights %}
  <text x="{{ 220 + loop.index0 * 320 }}" y="855" text-anchor="middle" font-size="26" font-weight="bold" fill="#666">{{ h.label }}</text>
  <text x="{{ 220 + loop.index0 * 320 }}" y="915" text-anchor="middle" font-size="42" font-weight="900" fill="#000">{{ h.player }}</text>
  <text x="{{ 220 + loop.index0 * 320 }}" y="960" text-anchor="middle" font-size="28" font-weight="900" fill="#FF6F00">{{ h.detail }}</text>
  {% endfor %}
  <text x="540" y="1050" text-anchor="middle" font-size="22" fill="#888">{{ footer_handle }} — {{ footer_meta }}</text>
</svg>
