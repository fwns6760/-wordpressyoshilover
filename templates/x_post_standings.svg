<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="giantsRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00"/><stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="2" dy="3"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>
  <rect x="0" y="14" width="1080" height="200" fill="url(#header)"/>
  <rect x="0" y="214" width="1080" height="6" fill="#000000"/>
  <text x="60" y="68" font-size="28" font-weight="900" fill="#FFD700">{{ hook_line }}</text>
  <text x="540" y="135" text-anchor="middle" font-size="56" font-weight="900" fill="#ffffff">🏆 {{ league_name }}順位表</text>
  <text x="540" y="195" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">{{ subtitle }}</text>
  <rect x="60" y="250" width="960" height="640" fill="none" stroke="#000" stroke-width="4"/>
  <rect x="60" y="250" width="960" height="60" fill="#000000"/>
  <text x="110" y="292" text-anchor="middle" font-size="30" font-weight="900" fill="#FF6F00">順位</text>
  <text x="280" y="292" text-anchor="middle" font-size="30" font-weight="900" fill="#FF6F00">球団</text>
  <text x="500" y="292" text-anchor="middle" font-size="30" font-weight="900" fill="#FF6F00">勝-敗-分</text>
  <text x="690" y="292" text-anchor="middle" font-size="30" font-weight="900" fill="#FF6F00">勝率</text>
  <text x="900" y="292" text-anchor="middle" font-size="30" font-weight="900" fill="#FF6F00">ゲーム差</text>
  {% for row in rows %}
  {% set y_base = 365 + loop.index0 * 95 %}
  {% if row.is_giants %}
  <g filter="url(#dropShadow)"><rect x="61" y="{{ y_base - 55 }}" width="958" height="92" fill="url(#giantsRow)"/></g>
  <text x="110" y="{{ y_base + 5 }}" text-anchor="middle" font-size="52" font-weight="900" fill="#ffffff" style="font-feature-settings:'tnum'">{{ row.rank }}</text>
  <text x="280" y="{{ y_base + 5 }}" text-anchor="middle" font-size="40" font-weight="900" fill="#ffffff">{{ row.team }} <tspan fill="#FFD700">★</tspan></text>
  <text x="500" y="{{ y_base + 5 }}" text-anchor="middle" font-size="38" font-weight="900" fill="#ffffff" style="font-feature-settings:'tnum'">{{ row.record }}</text>
  <text x="690" y="{{ y_base + 5 }}" text-anchor="middle" font-size="46" font-weight="900" fill="#FFD700" style="font-feature-settings:'tnum'">{{ row.pct }}</text>
  <text x="900" y="{{ y_base + 5 }}" text-anchor="middle" font-size="40" font-weight="900" fill="#ffffff" style="font-feature-settings:'tnum'">{{ row.gb }}</text>
  {% else %}
  <line x1="60" y1="{{ y_base - 55 }}" x2="1020" y2="{{ y_base - 55 }}" stroke="#e0e0e0" stroke-width="1"/>
  <text x="110" y="{{ y_base }}" text-anchor="middle" font-size="48" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ row.rank }}</text>
  <text x="280" y="{{ y_base }}" text-anchor="middle" font-size="38" font-weight="bold" fill="#000">{{ row.team }}</text>
  <text x="500" y="{{ y_base }}" text-anchor="middle" font-size="38" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ row.record }}</text>
  <text x="690" y="{{ y_base }}" text-anchor="middle" font-size="44" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ row.pct }}</text>
  <text x="900" y="{{ y_base }}" text-anchor="middle" font-size="38" font-weight="900" fill="#000" style="font-feature-settings:'tnum'">{{ row.gb }}</text>
  {% endif %}
  {% endfor %}
  <rect x="60" y="920" width="960" height="120" fill="url(#header)" stroke="#000" stroke-width="4"/>
  <text x="540" y="975" text-anchor="middle" font-size="34" font-weight="900" fill="#ffffff">{{ footer_summary }}</text>
  <text x="540" y="1015" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">{{ footer_handle }} — {{ footer_meta }}</text>
</svg>
