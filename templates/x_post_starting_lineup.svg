<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <defs>
    <linearGradient id="header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1080" height="14" fill="#000000"/>
  <rect x="0" y="14" width="1080" height="160" fill="url(#header)"/>
  <rect x="0" y="174" width="1080" height="6" fill="#000000"/>
  <text x="60" y="62" font-size="28" font-weight="900" fill="#FFD700">{{ hook_line }}</text>
  <text x="540" y="120" text-anchor="middle" font-size="54" font-weight="900" fill="#ffffff">📋 本日のスタメン</text>
  <text x="540" y="165" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">{{ subtitle }}</text>
  {% for p in players %}
  {% set col = loop.index0 % 3 %}
  {% set row_i = loop.index0 // 3 %}
  {% set x = 60 + col * 330 %}
  {% set y = 210 + row_i * 230 %}
  {% if p.is_star %}
  <rect x="{{ x }}" y="{{ y }}" width="300" height="200" fill="url(#cardOrange)" stroke="#000" stroke-width="4"/>
  <rect x="{{ x }}" y="{{ y }}" width="300" height="55" fill="#000000"/>
  <text x="{{ x + 20 }}" y="{{ y + 40 }}" font-size="28" font-weight="900" fill="#FFD700">{{ p.order }} {{ p.position }} ★</text>
  <text x="{{ x + 280 }}" y="{{ y + 40 }}" text-anchor="end" font-size="30" font-weight="900" fill="#ffffff">{{ p.stat }}</text>
  <text x="{{ x + 150 }}" y="{{ y + 120 }}" text-anchor="middle" font-size="46" font-weight="900" fill="#ffffff">{{ p.name }}</text>
  <text x="{{ x + 150 }}" y="{{ y + 175 }}" text-anchor="middle" font-size="28" font-weight="900" fill="#FFD700">{{ p.sub }}</text>
  {% else %}
  <rect x="{{ x }}" y="{{ y }}" width="300" height="200" fill="#ffffff" stroke="#000" stroke-width="4"/>
  <rect x="{{ x }}" y="{{ y }}" width="300" height="55" fill="#000000"/>
  <text x="{{ x + 20 }}" y="{{ y + 40 }}" font-size="28" font-weight="900" fill="#FF6F00">{{ p.order }} {{ p.position }}</text>
  <text x="{{ x + 280 }}" y="{{ y + 40 }}" text-anchor="end" font-size="30" font-weight="900" fill="#FFD700">{{ p.stat }}</text>
  <text x="{{ x + 150 }}" y="{{ y + 120 }}" text-anchor="middle" font-size="44" font-weight="900" fill="#000">{{ p.name }}</text>
  <text x="{{ x + 150 }}" y="{{ y + 175 }}" text-anchor="middle" font-size="26" font-weight="bold" fill="#666">{{ p.sub }}</text>
  {% endif %}
  {% endfor %}
  <rect x="0" y="940" width="1080" height="100" fill="url(#header)"/>
  <rect x="0" y="940" width="1080" height="6" fill="#000000"/>
  <text x="540" y="1000" text-anchor="middle" font-size="36" font-weight="900" fill="#ffffff">先発: {{ starting_pitcher }}</text>
  <text x="540" y="1065" text-anchor="middle" font-size="22" fill="#888">{{ footer_handle }} — {{ footer_meta }}</text>
</svg>
