<!DOCTYPE html>
<html lang="ja">
<head>

{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",

    {"@type": "ListItem", "position": 2, "name": "News"}
  ]
}

</head>

</article>
</body>
</html>
